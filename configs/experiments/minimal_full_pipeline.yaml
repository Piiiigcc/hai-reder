run_id: minimal_full_pipeline
experiment_name: minimal_local_full_pipeline
dataset_config: configs/dataset/minimal_local.yaml
model_config: configs/models/minimal_lora.yaml

outputs:
  logs_dir: outputs/logs
  tables_dir: outputs/tables
  metrics_dir: outputs/metrics
  predictions_dir: outputs/predictions
  transcripts_dir: outputs/debate_transcripts

debate:
  max_rounds: 3
  parse_failure_policy: low_confidence_review

confidence:
  tau_low: 0.4
  tau_high: 0.8
  verbal_confidence_map:
    very_low: 0.1
    low: 0.3
    medium: 0.5
    high: 0.7
    very_high: 0.9
  fusion_weights:
    self_evaluation: 0.34
    inter_agent_agreement: 0.33
    retrieval_similarity: 0.33
  weight_search_enabled: false
  weight_search:
    step: 0.1
    n_bins: 10
    output_path: models/calibration/optimal_weights.json
  s3_backend: tfidf
  sbert:
    model_name: all-MiniLM-L6-v2
    k: 5
    persist_path: models/calibration/sbert_index.json

online_learning:
  refresh_period_sprints: 2
  replay_ratio: 0.3
  new_data_ratio: 0.7
  pool_capacity: 500
  recency_partition_ratio: 0.6
  difficulty_partition_ratio: 0.4
  role_filter_enabled: false
  reinference_enabled: false
  reinference:
    adapter_dir: models/adapters/proposer
    prompt_template: prompts/agents/proposer_prompt.md
    max_examples: 5
    max_new_tokens: 128

training:
  data_source: bootstrap
  failure_rows_path: null
  real_transcripts_path: null

augmentation:
  enabled: true
  max_variants_per_seed: 2
  manual_review_sample_size: 10
  generator_backend: rule_based
  llm:
    backend: local
    model_name: HuggingFaceTB/SmolLM2-135M-Instruct
    prompt_template: prompts/augmentation/pair_augmentation_prompt.md
    validation_prompt_template: prompts/validation/augmentation_validation_prompt.md
    reference_pairs_per_prompt: 3
    max_new_tokens: 512
    temperature: 0.7
    validation_temperature: 0.3
    sbert_model: all-MiniLM-L6-v2
    embedding_min_distance: 0.1
    embedding_max_distance: 0.9
