run_id: minimal_lora
base_model:
  primary: "HuggingFaceTB/SmolLM2-135M-Instruct"
  fallbacks:
    - "Qwen/Qwen2.5-0.5B-Instruct"
    - "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    - "sshleifer/tiny-gpt2"

device_preference:
  - mps
  - cuda
  - cpu

tokenization:
  max_seq_length: 512

lora:
  r: 4
  alpha: 8
  dropout: 0.05
  target_modules: auto

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  epochs: 1
  max_steps: null
  seed: 42

roles:
  - proposer
  - critic
  - judge
