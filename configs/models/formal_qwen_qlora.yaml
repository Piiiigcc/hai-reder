run_id: formal_qwen_qlora
base_model:
  primary: "Qwen/Qwen2.5-7B-Instruct"
  fallbacks: []

device_preference:
  - cuda
  - cpu

tokenization:
  max_seq_length: 4096

# 4-bit QLoRA quantization for 7B model on 24GB VRAM
quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  epochs: 3
  max_steps: null
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  warmup_ratio: 0.03
  lr_scheduler_type: cosine

roles:
  - proposer
  - critic
  - judge
